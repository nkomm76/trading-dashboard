# Prüft jeden Push und Pull Request. Ist auf main alles grün, veröffentlicht GitHub die fertigen Images
# (ghcr.io/nkomm76/trading-dashboard und -tools) für den Docker Manager und setzt den Zweig "production".
# GitHub braucht dafür keinen Zugang zum Server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Routen-Typen (z. B. LayoutProps) entstehen sonst erst beim Build
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Baut beide Container-Images wie auf dem VPS; schlägt der Build fehl, kommt der Stand nicht auf den Server
      - run: docker build --target runner -t dividenden-app .
      - run: docker build --target tools -t dividenden-tools .

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    # Nie zwei Freigaben gleichzeitig; eine neuere ersetzt eine noch wartende ältere
    concurrency:
      group: release
      cancel-in-progress: true
    env:
      APP_IMAGE: ghcr.io/nkomm76/trading-dashboard
      TOOLS_IMAGE: ghcr.io/nkomm76/trading-dashboard-tools
      SOURCE: https://github.com/nkomm76/trading-dashboard
    steps:
      - uses: actions/checkout@v7
      - name: Nur freigeben, wenn dieser Stand noch der neueste auf main ist
        id: latest
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main ist inzwischen weiter ($head), diesen Stand nicht freigeben."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Fertige Images für den Docker Manager von Hostinger (deploy/docker-manager.yml zieht :latest)
      - name: Images bauen und veröffentlichen
        if: steps.latest.outputs.ok == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          short=${GITHUB_SHA::7}
          docker build --target runner --label "org.opencontainers.image.source=$SOURCE" -t "$APP_IMAGE:latest" -t "$APP_IMAGE:$short" .
          docker build --target tools --label "org.opencontainers.image.source=$SOURCE" -t "$TOOLS_IMAGE:latest" -t "$TOOLS_IMAGE:$short" .
          docker push --all-tags "$APP_IMAGE"
          docker push --all-tags "$TOOLS_IMAGE"
      - name: production auf diesen Stand setzen (für den Betrieb nach deploy/VPS.md)
        if: steps.latest.outputs.ok == 'true'
        run: |
          git push --force origin "$GITHUB_SHA:refs/heads/production"
          echo "production → $GITHUB_SHA"
